name: Automated Database Backup (Encrypted Offsite)

on:
  schedule:
    # Executa todos os dias às 03:00 UTC (00:00 / 24h Horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do acionamento manual do backup'
        required: false
        default: 'Rotina manual de segurança preventiva'

jobs:
  backup-database:
    name: Dump, Compress & Encrypt PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Latest PostgreSQL Client (PGDG) & GPG
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          # Adiciona repositório oficial da PostgreSQL Global Development Group (PGDG)
          # Isso garante que o pg_dump seja versão 16/17, evitando erro de version mismatch com o Supabase
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-16 gpg gzip

      - name: Execute Backup, Compress & Encrypt
        id: backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL não configurada no repositório GitHub (Settings > Secrets and variables > Actions). O backup não pode prosseguir."
            exit 1
          fi

          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Secret BACKUP_PASSPHRASE não configurada no repositório GitHub. Criptografia militar AES-256 obrigatória ausente."
            exit 1
          fi

          if [[ "$DB_URL" == *":6543"* ]]; then
            echo "::warning::Detectada porta 6543 (Transaction Pooler). O pg_dump exige a porta 5432 (Session Mode ou Conexão Direta). Se ocorrer falha, altere para a porta 5432 na secret SUPABASE_DB_URL."
          fi

          DATE_STAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          BACKUP_DIR="backups"
          mkdir -p "$BACKUP_DIR"

          RAW_DUMP="$BACKUP_DIR/previoffice_backup_${DATE_STAMP}.sql"
          COMPRESSED_DUMP="$RAW_DUMP.gz"
          ENCRYPTED_ARCHIVE="$COMPRESSED_DUMP.gpg"

          echo "Iniciando extração do banco de dados PreviOffice via pg_dump..."
          pg_dump "$DB_URL" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --format=plain \
            --file="$RAW_DUMP"

          echo "Compactando arquivo com nível máximo (gzip -9)..."
          gzip -9 "$RAW_DUMP"

          echo "Criptografando com padrão AES-256 (GPG simétrico com loopback)..."
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "$ENCRYPTED_ARCHIVE" "$COMPRESSED_DUMP"

          # Remove os arquivos não criptografados da máquina de execução
          rm -f "$COMPRESSED_DUMP"

          ARCHIVE_SIZE=$(ls -lh "$ENCRYPTED_ARCHIVE" | awk '{print $5}')
          echo "Backup concluído com sucesso!"
          echo "Arquivo final criptografado: $ENCRYPTED_ARCHIVE ($ARCHIVE_SIZE)"
          echo "CHECKSUM SHA-256:"
          sha256sum "$ENCRYPTED_ARCHIVE"

          echo "backup_path=$ENCRYPTED_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "backup_name=previoffice_backup_${DATE_STAMP}.sql.gz.gpg" >> "$GITHUB_OUTPUT"

      - name: Store Encrypted Backup as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.backup_name }}
          path: ${{ steps.backup.outputs.backup_path }}
          retention-days: 30
          if-no-files-found: error
